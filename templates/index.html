<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vector Converter</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <h1>Vector Converter</h1>
        <form id="uploadForm" enctype="multipart/form-data">
            <label for="file">Upload Image(s):</label>
            <input type="file" name="files" id="file" multiple>
            <label for="format">Output Format:</label>
            <select name="format" id="format">
                <option value="ai">AI (Adobe Illustrator)</option>
                <option value="eps">EPS (Encapsulated PostScript)</option>
            </select>
            <button type="submit">Convert</button>
        </form>
        <div id="resultSection" class="hidden">
            <h2>Converted Files</h2>
            <div id="fileList"></div>
        </div>
    </div>

    <script>
        document.getElementById("uploadForm").addEventListener("submit", async (e) => {
            e.preventDefault();

            const formData = new FormData();
            const files = document.getElementById("file").files;
            const format = document.getElementById("format").value;

            for (let file of files) {
                formData.append("files", file);
            }
            formData.append("format", format);

            const response = await fetch("/convert", {
                method: "POST",
                body: formData,
            });

            const result = await response.json();
            const fileList = document.getElementById("fileList");
            fileList.innerHTML = "";

            if (result.file_urls && result.file_urls.length > 0) {
                document.getElementById("resultSection").classList.remove("hidden");
                result.file_urls.forEach(url => {
                    const link = document.createElement("a");
                    link.href = url;
                    link.textContent = url.split("/").pop();
                    link.target = "_blank";
                    link.classList.add("file-link");
                    fileList.appendChild(link);
                    fileList.appendChild(document.createElement("br"));
                });
            } else {
                alert("No files were converted.");
            }
        });
    </script>
</body>
</html>
